apiVersion: v1
kind: Service
metadata:
  name: backend-api
  namespace: devops-lab
  labels:
    app.kubernetes.io/name: backend-api
    app.kubernetes.io/part-of: secure-docker-microservice-lab
spec:
  # Keep the API reachable only inside the cluster.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: backend-api
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
