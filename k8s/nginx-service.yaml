apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: devops-lab
  labels:
    app.kubernetes.io/name: nginx
    app.kubernetes.io/part-of: secure-docker-microservice-lab
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: nginx
  ports:
    # Stable local ports make the service reachable without a load balancer.
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
      protocol: TCP
    - name: https
      port: 443
      targetPort: https
      nodePort: 30443
      protocol: TCP
