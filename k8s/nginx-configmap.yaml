apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: devops-lab
  labels:
    app.kubernetes.io/name: nginx
    app.kubernetes.io/part-of: secure-docker-microservice-lab
data:
  # Kubernetes Service DNS is stable; unlike Docker Compose, no Docker resolver is needed.
  default.conf: |
    server {
        listen 8080;
        server_name myapp.local localhost;

        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        location / {
            return 308 https://$host:30443$request_uri;
        }
    }

    server {
        listen 8443 ssl;
        server_name myapp.local localhost;

        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        server_tokens off;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;

        location / {
            # backend-api resolves to the private ClusterIP Service in this namespace.
            proxy_pass http://backend-api:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
